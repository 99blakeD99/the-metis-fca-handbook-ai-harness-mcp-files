[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fca-handbook-harness-mcp"
version = "0.1.9"
description = "MCP server for FCA Handbook compliance analysis via the Metis FCA Handbook AI Harness API."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Blake Dempster", email = "the-metis-fca-handbook-ai-harness@jbmd.co.uk" }]
keywords = ["mcp", "fca", "compliance", "regulatory", "handbook"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0,<2.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/99blakeD99/the-metis-fca-handbook-ai-harness-mcp-files"
Repository = "https://github.com/99blakeD99/the-metis-fca-handbook-ai-harness-mcp-files.git"
Issues = "https://github.com/99blakeD99/the-metis-fca-handbook-ai-harness-mcp-files/issues"

[project.scripts]
fca-handbook-harness-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server"]
